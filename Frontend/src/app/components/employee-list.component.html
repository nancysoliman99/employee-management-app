<div class="container mt-4">
  <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
    {{ successMessage }}
    <button type="button" class="btn-close" (click)="clearMessages()"></button>
  </div>
  <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
    {{ errorMessage }}
    <button type="button" class="btn-close" (click)="clearMessages()"></button>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Employees</h2>
    <a class="btn btn-primary" routerLink="/create">+ Add Employee</a>
  </div>

  <div class="mb-3">
    <input
      type="text"
      class="form-control"
      placeholder="Search with  employees name"
      [(ngModel)]="searchTerm"
      (ngModelChange)="filterEmployees()"
    >
  </div>

  <table class="table table-bordered table-striped">
    <thead class="table-dark">
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Position</th>
        <th style="width: 150px">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let emp of filteredEmployees">
        <td>{{ emp.firstName }}</td>
        <td>{{ emp.lastName }}</td>
        <td>{{ emp.email }}</td>
        <td>{{ emp.position }}</td>
        <td>
          <a [routerLink]="['/edit', emp.id]" class="btn btn-sm btn-warning me-1">Edit</a>
          <button (click)="deleteEmployee(emp.id)" class="btn btn-sm btn-danger">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
